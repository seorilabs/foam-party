# Cloud Build 에서 Android AAB 를 만든다.
#
# 계약: seorilabs/.github docs/ci-cd/build-toolchain-contract.md
# 빌드 정의는 scripts/build-android.sh 가 소유한다. 여기서는 이미지를 고르고
# 시크릿을 주입하고 산출물을 옮길 뿐이다. 스텝에 빌드 명령을 추가하지 않는다.
#
# 이미지 태그는 build.env 의 GODOT_VERSION 과 같아야 한다. 호출부가
# _GODOT_VERSION 으로 넘긴다(GitHub Actions 는 build.env 에서 읽어 넘긴다).

substitutions:
  _GODOT_VERSION: "4.7.2"
  _VERSION_NAME: ""
  _VERSION_CODE: ""
  _ARTIFACT_BUCKET: ""

steps:
  - id: build-aab
    name: asia-northeast3-docker.pkg.dev/seorilabs-ci/builders/godot-android-builder:${_GODOT_VERSION}
    entrypoint: bash
    args: ["scripts/build-android.sh"]
    env:
      - ANDROID_VERSION_NAME=${_VERSION_NAME}
      - ANDROID_VERSION_CODE=${_VERSION_CODE}
    secretEnv:
      - GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64
      - GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD
      - GOOGLE_PLAY_UPLOAD_KEY_PASSWORD
      - GODOT_ANALYTICS_CONFIG_JSON_BASE64

availableSecrets:
  secretManager:
    - versionName: projects/seorilabs-ci/secrets/foam-party-play-keystore/versions/latest
      env: GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64
    - versionName: projects/seorilabs-ci/secrets/foam-party-play-keystore-password/versions/latest
      env: GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD
    - versionName: projects/seorilabs-ci/secrets/foam-party-play-key-password/versions/latest
      env: GOOGLE_PLAY_UPLOAD_KEY_PASSWORD
    - versionName: projects/seorilabs-ci/secrets/foam-party-analytics-config/versions/latest
      env: GODOT_ANALYTICS_CONFIG_JSON_BASE64

# AAB 는 호출부가 가져가 Play 에 올린다. 업로드는 빌드가 아니다.
artifacts:
  objects:
    location: ${_ARTIFACT_BUCKET}
    paths:
      - build/android/*.aab

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
