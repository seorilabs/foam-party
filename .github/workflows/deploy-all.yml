# Deploy All — 릴리즈 태그 1개를 해석해 AIT/Google Play/App Store 를 한 번에 배포.
# 각 마켓은 toggle 로 켜고 끈다. 로직은 org 재사용 워크플로우(각 로컬 caller 경유)에 위임.
name: Deploy All

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 SemVer 태그. 비우면 최신 vX.Y.Z."
        type: string
        required: false
        default: ""
      deploy_ait:
        type: boolean
        default: true
      deploy_google_play:
        type: boolean
        default: true
      deploy_app_store:
        type: boolean
        default: true
      memo:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-all-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version_name: ${{ steps.t.outputs.version_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: t
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            [ -n "$tag" ] || { echo "release_tag 비어있고 vX.Y.Z 태그 없음. 먼저 Release Tag 실행." >&2; exit 1; }
          fi
          version_name="${tag#v}"
          { echo "tag=$tag"; echo "version_name=$version_name"; } >> "$GITHUB_OUTPUT"

  ait:
    name: Deploy AIT
    needs: resolve
    if: ${{ inputs.deploy_ait }}
    uses: ./.github/workflows/deploy-apps-in-toss.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      memo: ${{ inputs.memo }}

  google-play:
    name: Deploy Google Play
    needs: resolve
    if: ${{ inputs.deploy_google_play }}
    uses: ./.github/workflows/deploy-google-play.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      version_name: ${{ needs.resolve.outputs.version_name }}
      upload: true

  app-store:
    name: Deploy App Store
    needs: resolve
    if: ${{ inputs.deploy_app_store }}
    uses: ./.github/workflows/deploy-app-store.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      upload: true
