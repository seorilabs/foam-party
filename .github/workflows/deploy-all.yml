# Deploy All — 릴리즈 태그 1개를 해석해 AIT/Google Play/App Store 를 한 번에 배포.
# 저장소가 public 이라 GitHub-hosted macOS 가 무료다. App Store 도 Actions 에서
# archive·업로드까지 끝내며 Xcode Cloud 는 쓰지 않는다.
name: Deploy All

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 SemVer 태그. 비우면 최신 vX.Y.Z."
        type: string
        required: false
        default: ""
      deploy_ait:
        type: boolean
        default: true
      deploy_google_play:
        type: boolean
        default: true
      deploy_app_store:
        type: boolean
        default: true
      google_play_track:
        description: "Google Play 배포 트랙"
        type: choice
        options: [internal, production]
        default: internal
      google_play_release_status:
        description: "Google Play 릴리스 상태"
        type: choice
        options: [draft, completed]
        default: completed
      memo:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-all-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: t
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            [ -n "$tag" ] || { echo "release_tag 비어있고 vX.Y.Z 태그 없음. 먼저 Release Tag 실행." >&2; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ait:
    name: Deploy AIT
    needs: resolve
    if: ${{ inputs.deploy_ait }}
    uses: ./.github/workflows/deploy-apps-in-toss.yml
    secrets:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
      GODOT_ANALYTICS_CONFIG_JSON_BASE64: ${{ secrets.GODOT_ANALYTICS_CONFIG_JSON_BASE64 }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_GA4_MP_API_SECRET: ${{ secrets.VITE_GA4_MP_API_SECRET }}
      VITE_TOSS_FULLSCREEN_AD_GROUP_ID: ${{ secrets.VITE_TOSS_FULLSCREEN_AD_GROUP_ID }}
      VITE_TOSS_INTERSTITIAL_AD_GROUP_ID: ${{ secrets.VITE_TOSS_INTERSTITIAL_AD_GROUP_ID }}
      VITE_TOSS_LEVEL_REWARD_AD_GROUP_ID: ${{ secrets.VITE_TOSS_LEVEL_REWARD_AD_GROUP_ID }}
      VITE_TOSS_REWARDED_AD_GROUP_ID: ${{ secrets.VITE_TOSS_REWARDED_AD_GROUP_ID }}
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      memo: ${{ inputs.memo }}

  google-play:
    name: Deploy Google Play
    needs: resolve
    if: ${{ inputs.deploy_google_play }}
    uses: ./.github/workflows/deploy-google-play.yml
    secrets:
      FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      GODOT_ANALYTICS_CONFIG_JSON_BASE64: ${{ secrets.GODOT_ANALYTICS_CONFIG_JSON_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      upload: true
      track: ${{ inputs.google_play_track }}
      release_status: ${{ inputs.google_play_release_status }}

  app-store:
    name: Deploy App Store
    needs: resolve
    if: ${{ inputs.deploy_app_store }}
    uses: ./.github/workflows/deploy-app-store.yml
    secrets:
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
      GODOT_ANALYTICS_CONFIG_JSON_BASE64: ${{ secrets.GODOT_ANALYTICS_CONFIG_JSON_BASE64 }}
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      upload: true
