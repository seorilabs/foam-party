# Deploy All — 릴리즈 태그 1개를 해석해 AIT/Google Play 를 한 번에 배포.
# App Store(iOS)는 GitHub Actions macOS(액션 미닛 쿼타)로 빌드하지 않는다. Xcode Cloud
# 로 빌드/업로드하며, 트리거는 Backoffice(ASC ciBuildRuns)에서 태그 대상으로 수행한다.
name: Deploy All

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 SemVer 태그. 비우면 최신 vX.Y.Z."
        type: string
        required: false
        default: ""
      deploy_ait:
        type: boolean
        default: true
      deploy_google_play:
        type: boolean
        default: true
      google_play_track:
        description: "Google Play 배포 트랙"
        type: choice
        options: [internal, production]
        default: internal
      google_play_release_status:
        description: "Google Play 릴리스 상태"
        type: choice
        options: [draft, completed]
        default: completed
      memo:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-all-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: t
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            [ -n "$tag" ] || { echo "release_tag 비어있고 vX.Y.Z 태그 없음. 먼저 Release Tag 실행." >&2; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ait:
    name: Deploy AIT
    needs: resolve
    if: ${{ inputs.deploy_ait }}
    uses: ./.github/workflows/deploy-apps-in-toss.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      memo: ${{ inputs.memo }}

  google-play:
    name: Deploy Google Play
    needs: resolve
    if: ${{ inputs.deploy_google_play }}
    uses: ./.github/workflows/deploy-google-play.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      upload: true
      track: ${{ inputs.google_play_track }}
      release_status: ${{ inputs.google_play_release_status }}
