# Godot 서명 AAB + Google Play 업로드 — 중앙 재사용 워크플로우(러너 seorilabs-x64-android 고정).
# 버전과 업로더는 중앙 정본이 소유한다. 저장소는 태그 파생값을 주입받기만 한다.
# contract(tools/, 선택): install_android_build_template.sh, build_admob_plugin.sh,
#   check_google_play_readiness.py
name: Deploy Google Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      upload:
        description: "true면 Google Play 업로드(false면 AAB 아티팩트만)"
        type: boolean
        default: false
      track:
        type: choice
        options: [internal, production]
        default: internal
      release_status:
        type: choice
        options: [draft, completed]
        default: draft
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      upload:
        type: boolean
        default: true
      track:
        type: string
        default: internal
      release_status:
        type: string
        default: completed

permissions:
  contents: read
  id-token: write

jobs:
  google-play:
    uses: seorilabs/.github/.github/workflows/godot-deploy-google-play.yml@9afa357f9ba6c8d6a813c7cec7ad3d35c626bdd5
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      upload: ${{ inputs.upload }}
      track: ${{ inputs.track }}
      release_status: ${{ inputs.release_status }}
      project_dir: godot
      scripts_dir: tools
      aab_name: foam-party-internal
      # 프로젝트가 개발/테스트된 엔진과 동일하게 4.7.stable 로 빌드 (재사용 워크플로우 기본값은 4.6.3).
      godot_version: "4.6.3"
      godot_status: "stable"
      # 주입 대상 preset과 export 대상 preset이 같아야 한다. 다르면 중앙 워크플로우가 fail-closed한다.
      android_export_preset: Android
