# App Store(iOS) 배포는 GitHub Actions macOS 로 빌드하지 않는다(액션 미닛 쿼타).
# Xcode Cloud 로 빌드/업로드하며, 트리거는 Backoffice(ASC ciBuildRuns)에서 태그 대상으로
# 수행한다(repo 는 XCODE_CLOUD_APP_STORE_REPOS allowlist 에 포함).
#
# 이 파일은 삭제하지 않고 비활성 스텁으로 남긴다: Backoffice 의 마켓 타깃 감지가
# `.github/workflows/deploy-app-store.yml` 파일 존재로 "appstore" 를 판정하므로(compute.ts
# pathExists), 파일이 없으면 Backoffice 에서 App Store 배포 옵션이 사라진다.
# workflow_call 은 제거해 deploy-all 등에서 호출할 수 없고, 수동 dispatch 시 macOS 빌드
# 없이 즉시 안내 후 실패한다(ARC runner, 쿼타 소모 없음).
name: Deploy App Store (disabled — use Xcode Cloud)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: App Store builds via Xcode Cloud
    runs-on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          echo "::error::App Store(iOS)는 Xcode Cloud로 빌드합니다. GitHub Actions macOS 빌드는 비활성입니다(액션 미닛 쿼타)."
          echo "App Store 배포는 Backoffice에서 트리거하세요(ASC ciBuildRuns, 태그 대상)."
          exit 1
