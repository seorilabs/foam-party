# foam-party App Store 배포. org 재사용 워크플로우 호출.
#
# 실행 환경: GitHub-hosted macOS(macos-26). 이 저장소는 public이라 표준 러너가
# 무료라 Xcode Cloud 없이 Actions에서 archive·서명·업로드를 끝낸다.
#
# 파일 자체는 삭제하지 않는다: Backoffice의 마켓 타깃 감지가
# `.github/workflows/deploy-app-store.yml` 존재로 "appstore"를 판정한다.
#
# 버전 정본은 릴리즈 태그 하나다. 같은 태그를 다시 올리면 build number가 같아
# App Store가 거부하므로 재업로드는 패치 태그로 한다.
name: Deploy to App Store

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그. 비우면 실행한 ref를 사용합니다."
        required: false
        default: ""
        type: string
      upload:
        description: "App Store Connect 업로드. false면 xcarchive artifact만 만듭니다."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  workflow_call:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그"
        required: false
        default: ""
        type: string
      upload:
        required: false
        default: false
        type: boolean
    secrets:
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64:
        required: false
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD:
        required: false
      APPLE_KEYCHAIN_PASSWORD:
        required: false
      APPLE_PROVISIONING_PROFILE_BASE64:
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64:
        required: false
      GODOT_ANALYTICS_CONFIG_JSON_BASE64:
        required: false

permissions:
  contents: read

concurrency:
  group: app-store-deploy-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: seorilabs/.github/.github/workflows/godot-deploy-app-store.yml@main
    secrets:
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
      GODOT_ANALYTICS_CONFIG_JSON_BASE64: ${{ secrets.GODOT_ANALYTICS_CONFIG_JSON_BASE64 }}
    with:
      release_tag: ${{ inputs.release_tag }}
      upload: ${{ inputs.upload == true || inputs.upload == 'true' }}
      project_dir: godot
      scripts_dir: tools
      # godot/project.godot 의 config/features("4.7")와 정합. 중앙 기본값(4.6.3)을 덮어쓴다.
      godot_version: "4.7.2"
      godot_status: "stable"
      # 주입 대상 preset과 export 대상 preset이 같아야 한다. 다르면 중앙이 fail-closed한다.
      ios_export_preset: iOS
      # export_presets.cfg의 iOS preset export_path와 같은 파일이어야 한다.
      # 파일명이 xcodebuild scheme 이름을 결정한다.
      xcode_project_path: release-artifacts/ios/xcode/foam-party.xcodeproj
      export_options_plist: app-store/exportOptions.plist
      bundle_id: com.seorilabs.foamparty
      # 커밋된 native_ads.json 기본값은 Google 테스트 ID다. archive 전에 iOS 운영
      # ID로 확정하고, 테스트 ID가 남으면 빌드를 멈춘다.
      #
      # 같은 스크립트를 import 전후로 두 번 부른다. 주입 대상이 둘이고 각각 살아남는
      # 시점이 다르다.
      #   - native_ads.json 의 유닛 ID: pck 에 들어가야 하므로 import 전
      #   - ProjectSettings 의 app id: godot --import 가 등록되지 않은 커스텀 설정을
      #     저장 시 버리므로 import 후
      # 스크립트는 환경 변수에서 값을 읽어 덮어쓰기만 하므로 두 번 실행해도 같다.
      prepare_project_script: tools/prepare_ios_native_ads.sh
      post_import_script: tools/prepare_ios_native_ads.sh
      # headless export가 끝내지 못하는 AdMob pbxproj 패치와 SwiftPM lockfile 고정.
      post_export_project_script: tools/prepare_ios_xcode_project.sh
