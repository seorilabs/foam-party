# Godot iOS export → Xcode archive → App Store Connect 업로드 — macos-26(ARC 금지).
# org 재사용 워크플로우 godot-deploy-app-store.yml 의 얇은 caller.
# contract(scripts/): ensure_godot.sh --with-export-templates, export_godot_ios.sh
#   (선택) resolve-release-version.mjs → apple_marketing_version, apple_build_number
name: Deploy App Store

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "업로드할 릴리즈 태그. 비우면 최신 vX.Y.Z."
        type: string
        required: false
        default: ""
      upload:
        description: "true면 App Store Connect 업로드(false면 xcarchive 아티팩트만)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      upload:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  app-store:
    uses: seorilabs/.github/.github/workflows/godot-deploy-app-store.yml@main
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      upload: ${{ inputs.upload }}
      ios_scheme: foam-party
      ios_bundle_id: com.seorilabs.foamparty
      ios_export_preset: iOS
      ios_output: build/ios/foam-party
      project_dir: godot
