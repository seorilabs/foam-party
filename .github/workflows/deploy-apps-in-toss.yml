# Godot Web export → AIT 래퍼 build → AppsInToss 배포 — ARC(seorilabs-rpi-arm64).
# org 재사용 워크플로우 godot-deploy-ait.yml 의 얇은 caller.
name: Deploy AppsInToss

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그. 비우면 호출 ref."
        type: string
        required: false
        default: ""
      memo:
        description: "AppsInToss 배포 메모"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      memo:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ait:
    uses: seorilabs/.github/.github/workflows/godot-deploy-ait.yml@main
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      memo: ${{ inputs.memo }}
      project_dir: godot
      wrapper_dir: apps/ait
