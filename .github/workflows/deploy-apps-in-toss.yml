# Godot Web export → AIT 래퍼 build → AppsInToss 배포 — ARC.
# AIT 웹 래퍼: ait/apps-in-toss-web.
name: Deploy AppsInToss

on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      memo:
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      memo:
        type: string
        required: false
        default: ""
    # caller 는 secret 을 상속하지 않는다. 아래 이름만 1:1 로 명시 전달한다.
    secrets:
      APPS_IN_TOSS_API_KEY:
        required: false
      GODOT_ANALYTICS_CONFIG_JSON_BASE64:
        required: false
      VITE_FIREBASE_API_KEY:
        required: false
      VITE_GA4_MP_API_SECRET:
        required: false
      VITE_TOSS_FULLSCREEN_AD_GROUP_ID:
        required: false
      VITE_TOSS_INTERSTITIAL_AD_GROUP_ID:
        required: false
      VITE_TOSS_LEVEL_REWARD_AD_GROUP_ID:
        required: false
      VITE_TOSS_REWARDED_AD_GROUP_ID:
        required: false

permissions:
  contents: read

jobs:
  ait:
    uses: seorilabs/.github/.github/workflows/godot-deploy-ait.yml@main
    secrets:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
      GODOT_ANALYTICS_CONFIG_JSON_BASE64: ${{ secrets.GODOT_ANALYTICS_CONFIG_JSON_BASE64 }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_GA4_MP_API_SECRET: ${{ secrets.VITE_GA4_MP_API_SECRET }}
      VITE_TOSS_FULLSCREEN_AD_GROUP_ID: ${{ secrets.VITE_TOSS_FULLSCREEN_AD_GROUP_ID }}
      VITE_TOSS_INTERSTITIAL_AD_GROUP_ID: ${{ secrets.VITE_TOSS_INTERSTITIAL_AD_GROUP_ID }}
      VITE_TOSS_LEVEL_REWARD_AD_GROUP_ID: ${{ secrets.VITE_TOSS_LEVEL_REWARD_AD_GROUP_ID }}
      VITE_TOSS_REWARDED_AD_GROUP_ID: ${{ secrets.VITE_TOSS_REWARDED_AD_GROUP_ID }}
    with:
      release_tag: ${{ inputs.release_tag }}
      memo: ${{ inputs.memo }}
      project_dir: godot
      wrapper_dir: ait/apps-in-toss-web
      # 중앙 워크플로우는 러너 기본값이 ARC 다. public 전환 시 private ARC 가
      # public 저장소 컨텍스트에서 돌지 않도록 caller 가 가드를 넘긴다.
      runs_on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
      # godot/project.godot 의 config/features("4.6")와 정합. 재사용 워크플로우 기본값도 4.6.3.
      godot_version: "4.6.3"
      godot_status: "stable"
