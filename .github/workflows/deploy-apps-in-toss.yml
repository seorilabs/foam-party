# Godot Web export → AIT 래퍼 build → AppsInToss 배포 — ARC.
# AIT 웹 래퍼: ait/apps-in-toss-web.
name: Deploy AppsInToss

on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      memo:
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      memo:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ait:
    uses: seorilabs/.github/.github/workflows/godot-deploy-ait.yml@9afa357f9ba6c8d6a813c7cec7ad3d35c626bdd5
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      memo: ${{ inputs.memo }}
      project_dir: godot
      wrapper_dir: ait/apps-in-toss-web
      # godot/project.godot 의 config/features("4.6")와 정합. 재사용 워크플로우 기본값도 4.6.3.
      godot_version: "4.6.3"
      godot_status: "stable"
