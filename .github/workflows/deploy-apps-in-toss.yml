# Godot Web export → AIT 래퍼 build → AppsInToss 배포 — ARC.
# NOTE: AIT 웹 래퍼(wrapper_dir)는 아직 이 repo 에 없음 → 별도 PR 에서 추가되면 배포 가능.
name: Deploy AppsInToss

on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      memo:
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      memo:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ait:
    uses: seorilabs/.github/.github/workflows/godot-deploy-ait.yml@main
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      memo: ${{ inputs.memo }}
      project_dir: godot
      # TODO(별도 PR): AIT 웹 래퍼 디렉터리. 아직 미존재 → 래퍼 추가 후 배포 가능.
      wrapper_dir: ait/apps-in-toss-web
      # 프로젝트가 개발/테스트된 엔진과 동일하게 4.7.stable 로 빌드 (재사용 워크플로우 기본값은 4.6.3).
      godot_version: "4.7"
      godot_status: "stable"
