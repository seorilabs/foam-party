# main 정적 게이트(Godot) — org 재사용 워크플로우 호출.
# import → compile/quality gate → smoke + core/architecture/workflows/docs. 무거운 export/배포 금지.
name: Godot Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: seorilabs/.github/.github/workflows/godot-checks.yml@main
    with:
      runs_on: ${{ github.event.repository.private && 'seorilabs-x64' || 'ubuntu-latest' }}
      project_dir: godot
      # 중앙 기본값은 4.6.3 이다. 프로젝트 config/features(4.7)와 ARC 러너 이미지에
      # preinstall 된 엔진에 맞춰 명시한다. 버전이 어긋나면 러너가 엔진을 새로 받는다.
      godot_version: "4.7.2"
      godot_status: "stable"
      check_command: |
        npm run test:core
        npm run check:architecture
        npm run check:workflows
        npm run check:native-ads
        npm run check:native-ads-config
        npm run check:ios-admob-patch
        npm run check:docs
        bash scripts/godot_quality_gate.sh --project godot --smoke-scene res://tests/smoke_scene.gd
        npm --prefix ait/apps-in-toss-web ci
        npm --prefix ait/apps-in-toss-web run lint
        npm --prefix ait/apps-in-toss-web test
