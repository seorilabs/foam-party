# Godot Web export → GitHub Pages. org 재사용 워크플로우 호출(export 캐시로 비용 절감).
# main과 PR은 정적 게이트만 실행하고 Pages 배포는 명시적 dispatch로만 시작한다.
name: Deploy Godot Web Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    uses: seorilabs/.github/.github/workflows/godot-pages.yml@main
    with:
      runs_on: ${{ github.event.repository.private && 'seorilabs-x64' || 'ubuntu-latest' }}
