# Google Play 트랙 승격(재빌드 없이) — org 재사용 워크플로우 호출.
# 선택한 릴리즈 태그의 versionCode 만 옮긴다. 트랙의 "최신 build" 를 올리는 것이 아니다.
#
# 이 저장소는 repo-local 업로더를 두지 않는다. upload_script 를 비워 중앙 기본
# 업로더를 쓴다. package_name 은 중앙 스크립트가 저장소 설정을 읽지 않으므로 필수다.
name: Promote Google Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "승격할 릴리즈 태그 (예: v1.3.18). 비우면 최신 vX.Y.Z."
        type: string
        required: false
        default: ""
      from_track:
        type: string
        required: false
        default: internal
      to_track:
        type: string
        required: false
        default: production
      release_status:
        description: "완전 출시=completed. rollout 지정 시 inProgress 로 전환."
        type: string
        required: false
        default: completed
      rollout:
        description: "단계적 출시 비율(0,1]. 비우면 완전 출시."
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      from_track:
        type: string
        required: false
        default: internal
      to_track:
        type: string
        required: false
        default: production
      release_status:
        type: string
        required: false
        default: completed
      rollout:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: foam-party-google-play-promote-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  promote:
    uses: seorilabs/.github/.github/workflows/promote-google-play.yml@main
    with:
      release_tag: ${{ inputs.release_tag }}
      from_track: ${{ inputs.from_track }}
      to_track: ${{ inputs.to_track }}
      release_status: ${{ inputs.release_status }}
      rollout: ${{ inputs.rollout }}
      package_name: com.seorilabs.foamparty
